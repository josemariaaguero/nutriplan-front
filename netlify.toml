# Netlify — NutriPlan frontend (Vite + React PWA)
# Site settings can override these; keep in sync with the dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback (PWA deep links / refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: set in Netlify UI → Environment variables (required for production API):
#   VITE_API_URL=https://YOUR-SERVICE.onrender.com
